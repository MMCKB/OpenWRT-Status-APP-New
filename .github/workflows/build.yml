name: Build APK

on:
  push:
    branches: ["main", "master", "Dev"]
  pull_request:
    branches: ["main", "master", "Dev"]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses & install build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"

      # This repo does not commit a Gradle wrapper jar; install Gradle explicitly instead.
      - name: Install Gradle 9.7.1
        run: |
          curl -sSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      # 还原签名密钥（来自仓库 Secrets）。未配置 Secrets 时跳过：
      # 构建会自动回退 debug 签名并使用 .dev 后缀的 applicationId。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/mmckb-release.p12
            printf 'storeFile=keystore/mmckb-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Signing credentials restored."
          else
            echo "No signing secrets configured; the build will fall back to debug signing."
          fi

      - name: Build APK (release, unified MMCKB signing)
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-status-app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
