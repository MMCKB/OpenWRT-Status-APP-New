name: Build APK

on:
  push:
    branches: ["main", "master", "Dev"]
  pull_request:
    branches: ["main", "master", "Dev"]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # This repo does not commit a Gradle wrapper jar; install Gradle explicitly instead.
      - name: Install Gradle 9.7.1
        run: |
          curl -sSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      - name: Build APKs (debug + release, unified MMCKB signing)
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-status-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-status-app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
