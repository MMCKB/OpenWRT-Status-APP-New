name: Build APK

on:
  push:
    branches: ["main", "master", "Dev"]
  pull_request:
    branches: ["main", "master", "Dev"]
  workflow_dispatch:

# dev-build 滚动 release 需要 contents:write 权限。
permissions:
  contents: write

jobs:
  build:
    name: Build per-ABI release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses & install build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"

      # This repo does not commit a Gradle wrapper jar; install Gradle explicitly instead.
      - name: Install Gradle 9.7.1
        run: |
          curl -sSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      # 还原签名密钥（来自仓库 Secrets）。未配置 Secrets 时跳过：
      # 构建会自动回退 debug 签名并使用 .dev 后缀的 applicationId。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/mmckb-release.p12
            printf 'storeFile=keystore/mmckb-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Signing credentials restored."
          else
            echo "No signing secrets configured; the build will fall back to debug signing."
          fi

      # splits.abi 一次构建产出 4 个 APK：arm64-v8a / armeabi-v7a / x86_64 / x86。
      - name: Build per-ABI release APKs
        run: gradle :app:assembleRelease --no-daemon

      # 改名为可读的文件名，产物与 release 里都是裸 APK 文件（不打包成 zip）。
      - name: Rename APKs per ABI
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/release/*arm64-v8a-release.apk   apk-out/OpenWrt-Status-arm64-v8a.apk
          cp app/build/outputs/apk/release/*armeabi-v7a-release.apk apk-out/OpenWrt-Status-armeabi-v7a.apk
          cp app/build/outputs/apk/release/*x86_64-release.apk      apk-out/OpenWrt-Status-x86_64.apk
          cp app/build/outputs/apk/release/*x86-release.apk         apk-out/OpenWrt-Status-x86.apk
          ls -l apk-out

      - name: Upload arm64-v8a APK (64 位)
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-Status-arm64-v8a
          path: apk-out/OpenWrt-Status-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK (32 位)
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-Status-armeabi-v7a
          path: apk-out/OpenWrt-Status-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload x86_64 APK (x86 64 位)
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-Status-x86_64
          path: apk-out/OpenWrt-Status-x86_64.apk
          if-no-files-found: error

      - name: Upload x86 APK (x86 32 位)
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-Status-x86
          path: apk-out/OpenWrt-Status-x86.apk
          if-no-files-found: error

      # Dev 分支推送 / 手动触发时，把 4 个裸 APK 挂到滚动 release，
      # 从 release 页可以直接下载 APK 文件本身（artifact 下载时 GitHub 会强制套一层 zip）。
      - name: Publish raw APKs to rolling dev-build release
        if: github.ref == 'refs/heads/Dev' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev-build \
            --prerelease \
            --title "Dev 滚动构建" \
            --notes "Dev 分支每次推送自动覆盖更新的构建产物：4 个架构的 APK，可直接下载 APK 文件。" \
            || true
          gh release upload dev-build apk-out/*.apk --clobber
