[package]
name = "owrt_core"
version = "0.1.0"
edition = "2021"
description = "OpenWrt Status 的 Rust 核心：SSH 传输层，经 JNI 暴露给 Kotlin"

[lib]
name = "owrt_core"
crate-type = ["cdylib", "lib"]

[dependencies]
russh = "0.63"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
jni = "0.21"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
